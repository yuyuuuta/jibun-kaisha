name: Fetch RSS News

on:
  schedule:
    - cron: '0 12 * * *'  # 毎日 UTC 12:00 = JST 21:00（遅延考慮で翌朝7時頃に実行される）
  workflow_dispatch:       # GitHub上から手動実行も可能

permissions:
  contents: write  # report.jsonのcommit/pushに必要。新規作成リポジトリはデフォルトが読み取り専用のため明示指定（2026/07/07障害対応）

jobs:
  fetch-rss:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedparser

      - name: Fetch RSS and update report.json
        run: python scripts/fetch_rss.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/report.json
          git diff --staged --quiet || git commit -m "chore: 自動RSSフェッチ $(date '+%Y-%m-%d')"
          git pull --rebase origin main
          git push
